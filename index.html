<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bore: bore deeper, build tunnels, extract fees</title>
<meta name="description" content="Bore is a Solana launchpad of autonomous tunnel boring machine NFTs. Every tunnel is a coin launched on pump.fun and a tradable Tunnel NFT that earns royalties.">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/logo.png">
<meta name="theme-color" content="#3A2213">
<meta property="og:title" content="Bore: bore deeper, build tunnels, extract fees">
<meta property="og:description" content="A Solana launchpad of autonomous tunnel boring machines. Every tunnel is a coin on pump.fun and a Tunnel NFT that earns royalties.">
<meta property="og:image" content="/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
<style>
:root{
  --bg:#F4ECE2;--panel:#FFFBF6;--ink:#2B180B;--soft:#5C3D25;--mute:#8E6E52;--rule:#E3D3C1;--edge:#2B180B;--frame:#2B180B;
  --or:#F28C00;--or-ink:#9E5600;--s1:#D9C2A5;--s2:#C3A684;--s3:#A88763;--shaft:#2B180B;--dead:#8E6E52;
  --grid:rgba(43,24,11,.045);--stripe:rgba(43,24,11,.035);
  --f-stencil:'Saira Stencil One','Arial Black',Impact,sans-serif;
  --f-head:'Saira Condensed','Arial Narrow',sans-serif;
  --f-ui:'Work Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#3A2213;--panel:#47291A;--ink:#FFF4E6;--soft:#E6CFB4;--mute:#B4916F;--rule:#664129;--edge:#FFF4E6;--frame:#7A5236;
    --or:#FF9F1A;--or-ink:#FFB547;--s1:#5C3820;--s2:#4C2D19;--s3:#3A2112;--shaft:#E9DCCB;--dead:#7E5A3E;
    --grid:rgba(255,255,255,.03);--stripe:rgba(255,255,255,.04);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#3A2213;--panel:#47291A;--ink:#FFF4E6;--soft:#E6CFB4;--mute:#B4916F;--rule:#664129;--edge:#FFF4E6;--frame:#7A5236;
  --or:#FF9F1A;--or-ink:#FFB547;--s1:#5C3820;--s2:#4C2D19;--s3:#3A2112;--shaft:#E9DCCB;--dead:#7E5A3E;
  --grid:rgba(255,255,255,.03);--stripe:rgba(255,255,255,.04);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--f-ui);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 30px;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--or-ink);outline-offset:3px}
.wrap{max-width:1420px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1.5px solid var(--frame)}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0;padding:13px 18px;border-bottom:1px solid var(--rule);font:600 12px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase}
.ph small{font-weight:400;color:var(--mute);letter-spacing:.04em}
.ph .pix{height:18px;width:auto} .ph .art{width:34px}
.ph .end{margin-left:auto}
.pad{padding:18px}
.tag{display:inline-block;font:600 11px/1 var(--f-mono);letter-spacing:.05em;padding:5px 7px;background:var(--ink);color:var(--bg);text-transform:uppercase}
.tag.or{background:var(--or);color:#2B180B}
.tag.ghost{background:transparent;color:var(--soft);border:1px solid var(--rule)}
.pix rect{fill:var(--ink)} .pix .o{fill:var(--or)}
.small{font-size:13px;color:var(--soft)}
.warn{color:#B42318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{color:#FFA08F}}
:root[data-theme="dark"] .warn{color:#FFA08F}
.art{display:block;aspect-ratio:169 / 93;background-size:contain;background-repeat:no-repeat;background-position:center;image-rendering:pixelated}

/* header */
.top{margin-bottom:16px}
.nav{display:grid;grid-template-columns:auto 1fr auto}
.brand{display:flex;align-items:center;gap:12px;padding:10px 20px;border-right:1px solid var(--rule);text-decoration:none}
.brand .art{width:80px;flex:none}
.brand b{display:block;font:400 32px/.9 var(--f-stencil);letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;margin-top:6px;font:500 11px/1 var(--f-mono);color:var(--mute);letter-spacing:.05em}
.tabs{display:grid;grid-template-columns:repeat(8,minmax(92px,1fr));overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:15px 8px 12px;border-right:1px solid var(--rule);text-decoration:none;color:var(--soft);font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tabs a em{position:absolute;top:7px;right:8px;font-style:normal;color:var(--mute);font-size:10px}
.tabs a .pix{height:22px;width:auto} .tabs a .art{width:40px}
.tabs a:hover{background:var(--stripe)}
.tabs a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -4px 0 var(--or)}
.walletcell{position:relative;display:flex;align-items:center;padding:12px 18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font:700 14px/1.2 var(--f-ui);border:1.5px solid var(--edge);background:var(--panel);color:var(--ink);padding:12px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--edge);text-decoration:none;white-space:nowrap}
.btn:active:not([disabled]){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.btn.or{background:var(--or);color:#2B180B;border-color:#2B180B}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sm{padding:8px 11px;font-size:12.5px;box-shadow:2px 2px 0 var(--edge)}
.btn.wide{width:100%;padding:19px;font-size:16px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn .dot{width:9px;height:9px;background:#2B180B;display:inline-block}
.btn.connected .dot{background:var(--or);outline:1.5px solid var(--edge)}
.chip{font:600 11px/1 var(--f-mono);letter-spacing:.03em;border:1.5px solid var(--edge);background:var(--panel);padding:7px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--or);color:#2B180B;border-color:#2B180B}
.link{font:700 13px/1 var(--f-ui);border:0;background:none;padding:3px 0;border-bottom:3px solid var(--or);cursor:pointer;text-decoration:none}

/* site */
.grid-hero{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;align-content:start;min-width:0}
label,.lbl{display:block;font:500 11px/1.2 var(--f-mono);color:var(--soft);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
.big{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px}
.big b{font:400 100px/.85 var(--f-stencil)}
.big span{font:600 30px var(--f-head);color:var(--mute)}
.ticks{display:flex;gap:2px;height:16px;margin:6px 0 18px}
.ticks i{flex:1;background:var(--rule)} .ticks i.on{background:var(--ink)} .ticks i.last{background:var(--or)}
.kv4{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);margin-bottom:18px}
.kv4>div{padding:12px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kv4>div:nth-child(2n){border-right:0}
.kv4>div:nth-last-child(-n+2){border-bottom:0}
.kv4 b{font:500 17px/1.2 var(--f-mono)}
.hero-copy{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:end;padding:28px 28px 8px}
h1{font:400 clamp(36px,4.6vw,66px)/.95 var(--f-stencil);text-transform:uppercase;margin:0}
h1 em{font-style:normal;color:var(--or-ink)}
.hero-copy p{font-size:16.5px;color:var(--soft);margin:0}
.mapwrap{padding:14px 18px 0}
.map{display:block;width:100%;height:auto}
.map .s1{fill:var(--s1)} .map .s2{fill:var(--s2)} .map .s3{fill:var(--s3)}
.map .grass{fill:var(--or)} .map .shaft{fill:var(--shaft)}
.map .hubt{font:600 4px var(--f-mono);fill:var(--bg)} .map .hubb{fill:var(--shaft)}
.map .t-live{fill:var(--or)} .map .t-dead{fill:var(--dead)} .map .c-grad{fill:#FFFFFF;stroke:var(--or);stroke-width:.6}
.map .trunk{fill:var(--or);opacity:.35}
.map .bore{animation:bore 1.6s steps(4) infinite}
@keyframes bore{50%{transform:translateX(.6px)}}
.map rect{cursor:help}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;padding:14px 20px 18px;font:500 12.5px var(--f-mono);color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:14px;height:6px;display:inline-block}
.kv2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.kv2>div{padding:14px 18px}
.kv2>div+div{border-left:1px solid var(--rule)}
.kv2 b{font:400 24px/1.1 var(--f-stencil);text-transform:uppercase;overflow-wrap:anywhere}
.btnrow{display:flex;gap:12px;padding:18px;border-top:1px solid var(--rule)}
.btnrow .btn{flex:1}
.feed{display:grid;grid-template-columns:repeat(6,1fr)}
.feed>div{padding:18px 14px;text-align:center;border-right:1px solid var(--rule)}
.feed>div:last-child{border-right:0}
.feed .tbm{width:118px;margin:0 auto 10px}
.feed b{display:block;font:700 22px var(--f-head)}
.feed p{margin:2px 0 6px;font-size:13px;color:var(--soft);line-height:1.35}
.ago{font:500 11px var(--f-mono);color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.empty{padding:28px 20px;color:var(--soft);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.empty .art{width:84px}
.steps{display:grid;grid-template-columns:repeat(5,1fr)}
.steps>div{padding:20px 18px 24px;border-right:1px solid var(--rule)}
.steps>div:last-child{border-right:0}
.steps .pix{height:34px;width:auto;margin-bottom:14px} .steps .art{width:64px;margin-bottom:12px}
.steps .n{display:block;font:500 12px var(--f-mono);color:var(--or-ink);margin-bottom:6px}
.steps h3{margin:0 0 6px;font:700 23px/1.05 var(--f-head);text-transform:uppercase}
.steps p{margin:0;color:var(--soft);font-size:14.5px}
.mt{margin-top:16px}

/* tbm card */
.tbm{display:block}
.tbm.idle .art{filter:grayscale(.9);opacity:.6}
.tbm .tb{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:6px}
.tbm .tb i{height:4px;background:var(--rule)} .tbm .tb i.on{background:var(--or)}
.tbm .lv{display:flex;gap:3px;justify-content:center;margin-top:4px;min-height:5px}
.tbm .lv i{width:5px;height:5px;background:var(--or)}

/* deploy */
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.step h3{font:700 30px/1.05 var(--f-head);text-transform:uppercase;margin:0 0 8px}
.step p{margin:0 0 16px;color:var(--soft);max-width:68ch}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.opt{text-align:left;border:1.5px solid var(--edge);background:var(--panel);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--or),4px 4px 0 var(--edge)}
.opt b{font:700 22px/1.05 var(--f-head);text-transform:uppercase;margin-top:8px}
.opt>span{color:var(--soft);font-size:14px}
.opt dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0;font:500 12px var(--f-mono)}
.opt dt{color:var(--mute)} .opt dd{margin:0;text-align:right}
.bores{display:flex;gap:2px;height:12px;align-items:flex-end}
.bores i{width:5px;height:12px;background:var(--or)}
.note{font-size:13.5px;color:var(--soft);margin:14px 0 0;padding-left:12px;border-left:3px solid var(--or)}
.youget{display:flex;gap:18px;align-items:center;padding:18px}
.youget .frame{border:1px solid var(--rule);padding:10px;width:170px;flex:none}
.youget b{display:block;font:400 42px/1 var(--f-stencil)}
.youget span{color:var(--soft);font-size:14px}
.rows>div{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:14px 18px;border-bottom:1px solid var(--rule)}
.rows>div:last-child{border-bottom:0}
.rows label{margin:0}
.rows b{font:500 15px var(--f-mono);text-align:right}

/* lists */
.filters{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:16px 18px}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg>span{font:500 11px var(--f-mono);color:var(--mute);letter-spacing:.05em;text-transform:uppercase;margin-right:4px}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.lcard{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:16px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.lcard h4{margin:0 0 6px;font:700 26px/1 var(--f-head);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lcard dl,.tcard dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0 0 12px;font:500 11.5px var(--f-mono)}
.lcard dt,.tcard dt{color:var(--mute)} .lcard dd,.tcard dd{margin:0;text-align:right}
.lcard .btn{width:100%;white-space:normal;text-align:center}
.auc{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:22px;align-items:center;padding:20px}
.auc h4{margin:0 0 4px;font:700 30px/1 var(--f-head)}
.bid{font:400 40px/1 var(--f-stencil);margin:4px 0}
.bid small{font:500 13px var(--f-mono);color:var(--soft)}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tcard{padding:16px 18px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);display:flex;flex-direction:column}
.tcard h4{margin:0 0 8px;font:700 28px/1 var(--f-head);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tcard .tg{display:block;width:100%;height:auto;margin:0 0 12px}
.tcard .btns{margin-top:auto}
.tg .s1{fill:var(--s1)} .tg .s2{fill:var(--s2)} .tg .t-live{fill:var(--or)} .tg .t-dead{fill:var(--dead)} .tg .shaft{fill:var(--shaft)}
.nets{display:grid;grid-template-columns:repeat(4,1fr)}
.net{padding:18px;border-right:1px solid var(--rule)}
.net:last-child{border-right:0}
.net h3{margin:0 0 4px;font:400 34px/1 var(--f-stencil)}
.net .stats{grid-template-columns:1fr}

/* tbms */
.kv5{display:grid;grid-template-columns:repeat(5,1fr)}
.kv5>div{padding:16px 18px;border-right:1px solid var(--rule)}
.kv5>div:last-child{border-right:0}
.kv5 b{display:block;font:500 21px/1.2 var(--f-mono)}
.kv5 b.g{color:var(--or-ink)}
.actions{display:flex;flex-wrap:wrap;gap:12px;padding:18px;border-top:1px solid var(--rule)}
.trow{display:grid;grid-template-columns:190px minmax(0,1fr) minmax(0,1.15fr);border-top:1px solid var(--rule)}
.trow:first-of-type{border-top:0}
.trow>div{padding:18px}
.trow>div+div{border-left:1px solid var(--rule)}
.trow h3{margin:0 0 8px;font:400 34px/1 var(--f-stencil);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:10px 0 14px}
.stats b{display:block;font:500 15px var(--f-mono)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--rule)}
.up:last-child{border-bottom:0}
.up b{font:700 14.5px var(--f-ui)}
.up small{grid-column:1;font-size:12.5px;color:var(--soft)}
.up .btn{grid-row:1 / span 2;grid-column:2}
.pips{display:inline-flex;gap:3px;margin-left:8px;vertical-align:1px}
.pips i{width:9px;height:9px;border:1px solid var(--edge);display:inline-block}
.pips i.on{background:var(--or)}
.rentbox{border:1px solid var(--rule);padding:12px 14px;margin-bottom:12px;background:var(--stripe)}
.rentbox b{display:block;font:700 14.5px var(--f-ui);margin-bottom:2px}
.rentbox p{margin:0 0 10px;font-size:13px;color:var(--soft)}

/* how */
.split{padding:22px 22px 6px}
.squares{display:grid;grid-template-columns:repeat(50,1fr);gap:2px}
.squares i{aspect-ratio:1;display:block}
.sq-a{background:var(--or)} .sq-r{background:var(--or-ink);opacity:.55} .sq-b{background:var(--ink)} .sq-c{background:var(--mute);opacity:.5}
.splitkeys{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);margin-top:18px}
.splitkeys>div{padding:16px 22px;border-right:1px solid var(--rule)}
.splitkeys>div:last-child{border-right:0}
.splitkeys .k{display:flex;gap:8px;align-items:center;font:700 15px var(--f-ui)}
.splitkeys .k i{width:13px;height:13px;display:inline-block}
.splitkeys b{display:block;font:400 52px/1 var(--f-stencil);margin:8px 0 4px}
.splitkeys p{margin:0;color:var(--soft);font-size:14px}
.fly{padding:10px 18px 18px}
.fly svg{display:block;width:100%;height:auto;max-width:900px;margin:0 auto}
.fly .ringe{fill:none;stroke:var(--mute);stroke-width:1.5;stroke-dasharray:5 5}
.fly .node rect{fill:var(--panel);stroke:var(--edge);stroke-width:1.5}
.fly .node.hot rect{fill:var(--or);stroke:#2B180B}
.fly .node text{font:600 13px var(--f-ui);fill:var(--ink)}
.fly .node.hot text{fill:#2B180B}
.fly .arr{fill:var(--mute)}
.fly ol{display:none;margin:0;padding:0 0 0 22px}
.fly ol li{padding:6px 0;font-weight:600}
.pbody{padding:18px 22px}
.pbody p{margin:0 0 10px;color:var(--soft)}
.pbody p:last-child{margin:0}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--soft);text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--stripe)}
td{padding:12px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-family:var(--f-mono)}
.tw{overflow-x:auto}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}

/* docs */
.docs{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.toc ol{list-style:none;margin:0;padding:8px 18px 14px}
.toc li button{display:flex;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 0;cursor:pointer;font-size:14.5px}
.toc li button span{font:500 11px var(--f-mono);color:var(--mute);padding-top:3px}
.doc{scroll-margin-top:16px}
.doc .body{padding:20px 24px 24px;max-width:80ch}
.doc .body p,.doc .body li{color:var(--soft)}
.doc .body strong{color:var(--ink)}
.doc .body h4{font:700 21px var(--f-head);text-transform:uppercase;margin:20px 0 6px}
.doc code{font:500 12.5px var(--f-mono);background:var(--stripe);padding:2px 5px}
.doc .tw{margin:12px 0;border:1px solid var(--rule)}
details{border-bottom:1px solid var(--rule)}
details summary{cursor:pointer;padding:13px 0;font-weight:700;list-style:none}
details summary::before{content:"▸";display:inline-block;width:18px;font-size:12px}
details[open] summary::before{content:"▾"}
details p{margin:0 0 14px 18px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(30,16,6,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{max-width:640px;width:100%;max-height:calc(100% - 32px);overflow:auto;box-shadow:6px 6px 0 var(--or)}
.modal.wide{max-width:880px}
.x{margin-left:auto;background:none;border:0;font:700 18px var(--f-mono);cursor:pointer;padding:0 4px}
.wlist{display:grid;gap:10px;padding:18px}
.wopt{display:flex;align-items:center;gap:14px;border:1.5px solid var(--edge);background:var(--panel);padding:12px 14px;cursor:pointer;text-align:left;font:700 15px var(--f-ui);text-decoration:none}
.wopt img,.wopt .ph-ico{width:28px;height:28px;flex:none}
.wopt .ph-ico{background:var(--mute)}
.wopt em{margin-left:auto;font:500 11px var(--f-mono);font-style:normal;color:var(--or-ink);text-transform:uppercase;letter-spacing:.05em}
.wopt:hover{background:var(--stripe)}
.menu{position:absolute;right:18px;top:calc(100% - 4px);z-index:40;min-width:260px;box-shadow:4px 4px 0 var(--or)}
.menu .rows>div{padding:12px 16px}
.mitems{display:grid;border-top:1px solid var(--rule)}
.mitems button,.mitems a{text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:12px 16px;cursor:pointer;font:600 14px var(--f-ui);text-decoration:none}
.mitems>*:last-child{border-bottom:0}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;font:500 14px var(--f-ui);box-shadow:4px 4px 0 var(--or)}
footer{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;padding:22px 2px 36px;font-size:13px;color:var(--soft)}

@media (max-width:1200px){
  .grid-hero{grid-template-columns:minmax(0,1fr)}
  .grid-hero>.hero{order:-1}
  .grid-2{grid-template-columns:minmax(0,1fr)}
  .opts{grid-template-columns:1fr 1fr}
  .feed{grid-template-columns:repeat(3,1fr)}
  .feed>div:nth-child(3n){border-right:0}
  .feed>div:nth-child(-n+3){border-bottom:1px solid var(--rule)}
  .steps{grid-template-columns:1fr 1fr}
  .steps>div{border-bottom:1px solid var(--rule)}
  .trow{grid-template-columns:160px minmax(0,1fr)}
  .trow>div:last-child{grid-column:1 / -1;border-left:0;border-top:1px solid var(--rule)}
  .docs{grid-template-columns:minmax(0,1fr)}
  .toc{position:static}
  .nets{grid-template-columns:1fr 1fr}
  .net:nth-child(2n){border-right:0}
  .net:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .kv5{grid-template-columns:repeat(3,1fr)}
  .kv5>div:nth-child(3){border-right:0}
  .kv5>div:nth-child(-n+3){border-bottom:1px solid var(--rule)}
  .splitkeys{grid-template-columns:1fr 1fr}
  .splitkeys>div:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .splitkeys>div:nth-child(2){border-right:0}
}
@media (max-width:1100px){
  .nav{grid-template-columns:1fr auto}
  .brand{border-right:0}
  .tabs{grid-column:1 / -1;grid-row:2;display:flex;border-top:1px solid var(--rule)}
  .tabs a{flex:1 0 94px}
}
@media (max-width:760px){
  .hero-copy{grid-template-columns:minmax(0,1fr);padding:24px 20px 6px}
  .map .hubt,.map .hubb{display:none}
  .auc{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:700px){
  .wrap{padding:10px}
  .opts,.two,.nets{grid-template-columns:minmax(0,1fr)}
  .net{border-right:0!important;border-bottom:1px solid var(--rule)}
  .feed{grid-template-columns:1fr 1fr}
  .feed>div{border-bottom:1px solid var(--rule)}
  .feed>div:nth-child(2n){border-right:0}
  .feed>div:nth-child(3n){border-right:1px solid var(--rule)}
  .feed>div:nth-child(6n){border-right:0}
  .steps{grid-template-columns:1fr}
  .steps>div{border-right:0}
  .kv5{grid-template-columns:1fr 1fr}
  .kv5>div{border-right:1px solid var(--rule)!important;border-bottom:1px solid var(--rule)}
  .kv5>div:nth-child(2n){border-right:0!important}
  .splitkeys{grid-template-columns:1fr}
  .splitkeys>div{border-right:0!important;border-bottom:1px solid var(--rule)}
  .squares{grid-template-columns:repeat(25,1fr)}
  .fly svg{display:none} .fly ol{display:block}
  .big b{font-size:80px}
  .kv2 b{font-size:20px}
  .brand{padding:10px 12px;gap:8px}
  .brand .art{width:58px}
  .brand b{font-size:24px}
  .walletcell{padding:10px 12px}
  .walletcell .btn{padding:9px 10px;font-size:12.5px;gap:7px}
  .trow{grid-template-columns:minmax(0,1fr)}
  .trow>div+div{border-left:0;border-top:1px solid var(--rule)}
  .trow .tbm{max-width:200px}
  .lists{grid-template-columns:minmax(0,1fr)}
  .lcard{grid-template-columns:100px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .map .bore{animation:none}
  .btn:active:not([disabled]){transform:none}
}
</style>
</head>

function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(n){ n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return n >>> 0; }
function gauss(r = Math.random){ let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

function addOther(r){
  const n = S.tbm.length + 1; if (n > CFG.SUPPLY) return;
  const fee = mintPrice(n), x = r(), tier = x < 0.5 ? 0 : x < 0.8 ? 1 : x < 0.95 ? 2 : 3;
  const e = { id: n, owner: randAddr(r), tier, speed: 1 + Math.min(4, Math.floor(r() * r() * 5)), drill: 1 + Math.min(4, Math.floor(r() * r() * 5)), extra: 1 + (r() < 0.15 ? 1 : 0),

  if (r() < 0.2) e.list = { share: pick([0.5, 0.6, 0.7, 0.8], r), k: 0.8 + r() * 0.6, price: 0 };
  let burnTok = TIERS[tier].unlock;
  for (const k of ['speed','drill','extra']) for (let l = 1; l < e[k]; l++) burnTok += UP[k].cost(l);
  S.burnSol += fee * 0.5; S.burned += fee * 0.5 / price() + burnTok; S.ops += fee * 0.5;

function bore(e){
  const n = narr(), userOp = opIsUser(e);
  const c = newCoin({ tbm: e.id, tick: n.tick, desc: n.desc, F: Math.exp(Math.log(0.08) + 1.3 * gauss()) * (1 + 0.06 * (e.drill - 1)), owner: userOp ? W.addr : randAddr(Math.random), user: userOp, net: null });
  e.live++; e.count++; e.j.unshift(c.id); if (e.j.length > 64) e.j.length = 64;
  if (!userOp) {
    if (Math.random() < 0.5) connect(c, weightedNet());
    if (Math.random() < 0.2) c.price = r50(tunnelValue(c) * (0.7 + Math.random() * 0.7));
  }
  feedPush({ k: 'launch', tbm: e.id, tick: c.tick, tier: e.tier });
  if (userOp && S.speed <= 60) toast(`TBM #${e.id} finished a tunnel: $${c.tick}. The Tunnel NFT is yours.`);
}
function weightedNet(){ const tot = S.nets.reduce((a, n) => a + n.n + 4, 0); let x = Math.random() * tot; for (const n of S.nets) { x -= n.n + 4; if (x <= 0) return n.id; } return S.nets[0].id; }
function connect(c, id){ c.net = id; const n = S.nets[id - 1]; n.n++; if (c.user) S.myNet[id] = (S.myNet[id] || 0) + 1; }
function toNet(id, x){
  const n = S.nets[id - 1];
  n.inflow += x;
  S.burned += x * CFG.TR_BURN / price(); n.burned += x * CFG.TR_BURN / price();
  const members = x * CFG.TR_MEMBERS; n.paid += members;
  if (S.myNet[id]) S.netUn[id] = (S.netUn[id] || 0) + members * S.myNet[id] / n.n;
  n.fund += x * CFG.TR_LAUNCH;
  if (n.fund >= CFG.NET_LAUNCH_AT) {
    n.fund -= CFG.NET_LAUNCH_AT; const nn = narr();
    newCoin({ tbm: 0, net: id, netCoin: true, tick: nn.tick, desc: nn.desc, F: Math.exp(Math.log(0.08) + 1.3 * gauss()), owner: null, user: false });
    n.launches++; feedPush({ k: 'netlaunch', net: id, tick: nn.tick });
  }
}
function pay(c, f){
  c.fees += f;
  S.burned += f * CFG.BURN / price(); S.ops += f * CFG.OPS;
  if (c.netCoin) { toNet(c.net, f * (CFG.OPER + CFG.ROY)); return; }
  let op = f * CFG.OPER;
  if (c.net) { const cut = f * CFG.NET_CUT; op -= cut; toNet(c.net, cut); }
  const roy = f * CFG.ROY; c.roy += roy; if (c.user) c.royUn += roy;
  const e = tbmById.get(c.tbm);
  if (e) { const renter = e.rent ? op * e.rent.share : 0; e.rentUn += renter; e.unclaimed += op - renter; e.own += op - renter; e.life += op; e.rv += op; }
}
function startRent(e, who, isUser, hours, cost, share){
  e.rent = { who, user: isUser, until: S.t + hours * HOUR, share, hours }; e.rentUn = 0;
  S.burned += cost * CFG.RENT_BURN;
  if (e.user && !isUser) { S.wal.bor += cost * CFG.RENT_OWNER; toast(`TBM #${e.id} rented for ${hours === 1 ? '1 hour' : hours === 24 ? '1 day' : '1 week'}: +${fmtTok(cost * CFG.RENT_OWNER)} $BORE`); }
  S.ver++;
}
function endRent(e){
  if (e.rent.user && e.rentUn > 0) { S.wal.sol += e.rentUn; toast(`Rental of TBM #${e.id} ended. ${fmtSol(e.rentUn)} SOL settled to your wallet.`); }
  e.rentUn = 0; e.rent = null; S.ver++;
}
function prune(){
  const cut = S.t - 8 * HOUR;
  S.coins = S.coins.filter(c => c.alive || c.grad || c.t0 > cut || c.user || tbmById.get(c.tbm)?.user);
  coinById = new Map(S.coins.map(c => [c.id, c]));
  for (const e of S.tbm) if (e.list && !e.user) e.list.price = r50(fair(e, e.list.share) * e.list.k);
}
function spawnAuction(){
  const pool = S.tbm.filter(e => !e.user && !e.rent && !e.list && !inAuction(e)).sort((a, b) => hourly(b) - hourly(a)).slice(0, 10);
  if (!pool.length) return;
  const e = pick(pool), start = r50(fair(e, 0.7) * 24 * 0.55);
  S.auc.push({ a: S.nextA++, tbm: e.id, bid: start, start, bidder: null, ends: S.t + (1.5 + Math.random() * 2.5) * HOUR, share: 0.7 });
  S.ver++;
}
function step(dm){
  const t0 = S.t; S.t += dm * 60;
  if (S.tbm.length < CFG.SUPPLY && Math.random() < dm * CFG.OTHER_RATE) { addOther(Math.random); S.ver++; }
  for (const e of S.tbm) {
    if (e.rent && S.t >= e.rent.until) endRent(e);
    if (e.list && !e.rent && !inAuction(e)) {
      const a = Math.max(0.05, Math.min(3, fair(e, e.list.share) / e.list.price));
      if (Math.random() < dm / 1100 * a) { const x = Math.random(), d = DURS[x < 0.5 ? 0 : x < 0.9 ? 1 : 2]; startRent(e, randAddr(Math.random), false, d.h, e.list.price * d.h * (1 - d.off), e.list.share); }
    }
    if (e.live < capOf(e) && Math.random() < dm * CFG.BASE_RATE * (1 + 0.25 * (e.speed - 1)) * Math.sqrt(capOf(e))) bore(e);
  }
  for (const c of S.coins) {
    if (!c.alive) continue;
    const a0 = Math.max(0, (t0 - c.t0) / 60), a1 = Math.max(0, (S.t - c.t0) / 60);
    const f = c.F * (Math.exp(-a0 / c.L) - Math.exp(-a1 / c.L));
    if (f > 0) pay(c, f);
    if (!c.grad && c.gradAt > 0 && c.fees >= c.gradAt) { c.grad = true; S.ver++; }
    if (a1 > 3 * c.L) { c.alive = false; c.price = 0; const e = tbmById.get(c.tbm); if (e) e.live = Math.max(0, e.live - 1); S.ver++; }
    else if (c.price > 0 && Math.random() < dm / 300 * Math.max(0.05, Math.min(3, tunnelValue(c) * 1.1 / c.price))) {
      S.burned += c.price * CFG.SALE_ROYALTY;
      if (c.user) { S.wal.bor += c.price * (1 - CFG.SALE_ROYALTY); toast(`Tunnel $${c.tick} sold for ${fmtTok(c.price)} $BORE`); if (c.net && S.myNet[c.net]) S.myNet[c.net]--; }
      c.user = false; c.royUn = 0; c.owner = randAddr(Math.random); c.price = 0; S.ver++;
    }
  }
  const listed = S.coins.filter(c => c.price > 0 && !c.user);
  if (listed.length > 10) listed.slice(0, listed.length - 10).forEach(c => c.price = 0);
  const decay = Math.exp(-dm * 60 / (7 * DAY));
  for (const e of S.tbm) e.rv *= decay;
  for (const a of S.auc) {
    if (S.t < a.ends && Math.random() < dm / 40) {
      const nb = r50(Math.max(a.start, a.bid * (1.06 + Math.random() * 0.08)));
      if (nb <= fair(tbmById.get(a.tbm), a.share) * 24 * 1.25) { if (a.bidder === 'you') { S.wal.bor += a.bid; toast(`You were outbid on TBM #${a.tbm}`); } a.bid = nb; a.bidder = randAddr(Math.random); S.ver++; }
    }
  }
  for (const a of S.auc.filter(a => S.t >= a.ends)) {
    const e = tbmById.get(a.tbm);
    if (a.bidder && e && !e.rent) { startRent(e, a.bidder === 'you' ? W.addr : a.bidder, a.bidder === 'you', 24, a.bid, a.share); if (a.bidder === 'you') toast(`You won the auction for TBM #${e.id}. It’s yours to run for 24 hours.`); }
    else if (a.bidder === 'you') S.wal.bor += a.bid;
    S.auc = S.auc.filter(x => x !== a); S.ver++;
  }
  while (S.auc.length < 1) { const before = S.auc.length; spawnAuction(); if (S.auc.length === before) break; }
  if (Math.floor(S.t / HOUR) !== Math.floor(t0 / HOUR)) prune();
}
function advance(minutes){ while (minutes > 0) { const d = Math.min(5, minutes); step(d); minutes -= d; } }
function newWorld(){
  S = { v: 1, t: CFG.START_T - 2 * DAY, speed: 60, tbm: [], coins: [], feed: [], auc: [], burned: 0, burnSol: 0, ops: 0, wal: { sol: 30, bor: 300000 }, nextCoin: 1, nextA: 1, ver: 0,
    nets: [1,2,3,4].map(id => ({ id, n: 0, inflow: 0, burned: 0, paid: 0, fund: 0, launches: 0 })), myNet: {}, netUn: {} };
  tbmById = new Map(); coinById = new Map();
  const r = mulberry(41);
  for (let i = 0; i < 38; i++) addOther(r);
  advance(2 * 24 * 60);
  S.feed = S.feed.slice(0, 40);
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.v === 1 && Array.isArray(s.tbm)) { S = s; reindex(); return; } } } catch (e) {}

function addWallet(x){ if (!W.list.some(w => w.name.toLowerCase() === x.name.toLowerCase())) W.list.push(x); }
const wsApi = { register: (...ws) => { ws.forEach(w => { try { if (w.features && w.features['standard:connect'] && (w.chains || []).some(c => String(c).startsWith('solana:'))) addWallet({ name: w.name, icon: w.icon, kind: 'standard', w }); } catch (e) {} }); return () => {}; } };

function detectInjected(){
  const c = [['Phantom', window.phantom && window.phantom.solana], ['Solflare', window.solflare], ['Backpack', window.backpack], ['Solana wallet', window.solana]];
  for (const [n, p] of c) {
    if (!p || typeof p.connect !== 'function') continue;
    const name = p.isPhantom ? 'Phantom' : p.isSolflare ? 'Solflare' : n;
    if (!W.list.some(w => w.name.toLowerCase().startsWith(name.toLowerCase()))) addWallet({ name, icon: null, kind: 'injected', p });

}
function validAddr(a){
  try { if (window.solanaWeb3 && solanaWeb3.PublicKey) return new solanaWeb3.PublicKey(a).toBase58(); } catch (e) { return null; }
  return /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a) ? a : null;
}
async function connectEntry(entry, silent){
  let addr = null;
  if (entry.kind === 'standard') {
    const w = entry.w;
    if (silent) { if (w.accounts && w.accounts.length) addr = w.accounts[0].address; else return false; }
    else { const r = await w.features['standard:connect'].connect(); const acc = (r && r.accounts && r.accounts.length ? r.accounts : w.accounts)[0]; addr = acc && acc.address; }
    try { w.features['standard:events'] && w.features['standard:events'].on('change', ({ accounts }) => { if (accounts && accounts.length) setWallet(accounts[0].address, entry); else clearWallet(); }); } catch (e) {}

    const p = entry.p;

}
function setWallet(addr, entry){

  W.addr = ok; W.name = entry ? entry.name : 'Guest wallet'; W.entry = entry || null; W.kind = entry ? entry.kind : 'guest'; W.balance = null;
  try { localStorage.setItem(KEYW, JSON.stringify({ name: W.name, kind: W.kind, addr: W.kind === 'guest' ? W.addr : null })); } catch (e) {}

async function fetchBalance(){
  if (!window.solanaWeb3 || !W.addr) return;
  try {
    const conn = new solanaWeb3.Connection(CFG.RPC, 'confirmed');
    const lamports = await Promise.race([conn.getBalance(new solanaWeb3.PublicKey(W.addr)), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))]);

async function clearWallet(){

async function eagerConnect(){
  let saved = null; try { saved = JSON.parse(localStorage.getItem(KEYW) || 'null'); } catch (e) {}

  const nowR = performance.now();
  if (!latestSnap || nowR - latestAt > 30000) { latestSnap = S.feed.filter(f => f.k === 'launch').slice(0, 6); latestAt = nowR; }
  const conn = S.nets.reduce((a, x) => a + x.n, 0);
  return `<div class="grid-hero"><div class="col">
  <section class="panel">
    <h2 class="ph">${ICO.site} Status <small>the dig right now</small></h2>
    <div class="pad">
      <label>TBMs deployed</label>
      <div class="big"><b>${n}</b><span>/ ${CFG.SUPPLY}</span></div>
      <div class="ticks" aria-hidden="true">${Array.from({ length: 50 }, (_, i) => `<i class="${i < on ? 'on' : ''}${i === on - 1 ? ' last' : ''}"></i>`).join('')}</div>
      <div class="kv4">
        ${kv('Deploy price', n >= CFG.SUPPLY ? 'Sold out' : fmtSol(mintPrice(nn)) + ' SOL')}
        ${kv('Live tunnels', S.coins.filter(c => c.alive).length, 'live')}
        ${kv('Connected tunnels', conn)}
        ${kv('$BORE burned', fmtTok(S.burned), 'burned')}
      </div>
      <button class="btn or wide" data-go="deploy">Deploy a TBM</button>
    </div>
  </section>
  <section class="panel">
    <h2 class="ph">${ICO.coin} $BORE <small>token</small></h2>
    <div class="kv2"><div><label>Project</label><b>Bore</b></div><div><label>Ticker</label><b>$BORE</b></div></div>
    ${CFG.X ? `<div class="btnrow"><a class="btn" href="${esc(CFG.X)}" target="_blank" rel="noopener">Follow @BoreLiveSOL on X</a></div>` : ''}
  </section>
  </div>
  <section class="panel hero">
    <h2 class="ph">${ICO.net} The underground <small>every tunnel bored in the last hours</small></h2>
    <div class="hero-copy">
      <h1>Bore deeper. Build tunnels. <em>Extract fees.</em></h1>
      <p>Each TBM is an NFT that tunnels through Solana for narratives and launches coins on pump.fun. Every tunnel is a Tunnel NFT that earns royalties, and connected tunnels feed a shared network treasury.</p>
    </div>
    <div class="mapwrap">${mapSVG()}</div>
    <div class="legend">
      <span><i style="background:var(--or)"></i>Live tunnel</span>
      <span><i style="background:#FFFFFF;outline:1.5px solid var(--or)"></i>Graduated to PumpSwap</span>
      <span><i style="background:var(--dead)"></i>Gone quiet</span>
      <span><i style="background:var(--shaft);width:4px;height:12px"></i>Network shaft</span>
    </div>
  </section>
  </div>
  <section class="panel mt">
    <h2 class="ph">${ICO.docs} Latest tunnels <small>coins the TBMs just launched</small><button class="link end" data-go="tunnels">Open tunnels</button></h2>
    ${latestSnap.length ? `<div class="feed">${latestSnap.map(f => { const e = tbmById.get(f.tbm); return `<div>${e ? tbmHTML(e) : ''}<b>$${esc(f.tick)}</b><p>TBM #${f.tbm} · ${TIERS[f.tier].name}</p><span class="ago" data-k="ago:${f.t}">${ago(f.t)}</span></div>`; }).join('')}</div>`
      : `<div class="empty">${ART}<span>No tunnels yet.</span></div>`}
  </section>
  <section class="panel mt">
    <h2 class="ph">${ICO.how} How it works <small>five steps</small><button class="link end" data-go="how">All the rules</button></h2>
    ${stepsHTML()}
  </section>`;
}
function stepsHTML(){
  const st = [
    [ART, 'Deploy a TBM', 'Buy a tunnel boring machine NFT. Its tier sets how many tunnels it runs at once.'],
    [ICO.scan, 'Start boring', 'AI agents analyse on-chain activity, social trends and new token narratives.'],
    [ICO.tunnel, 'Excavate tunnels', 'Each tunnel is a new coin launched on pump.fun, and a Tunnel NFT for its operator.'],
    [ICO.coin, 'Collect fees', 'Creator fees flow back to the TBM, with royalties to whoever holds the tunnel.'],
    [ICO.net, 'Upgrade and connect', 'Spend $BORE on upgrades, and connect tunnels into networks that share a treasury.']
  ];
  return `<div class="steps">${st.map((x, i) => `<div>${x[0]}<span class="n">${pad2(i + 1)}</span><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div>`;
}

function vDeploy(){
  const n = S.tbm.length + 1, fee = mintPrice(n), tr = TIERS[D.tier], soldOut = n > CFG.SUPPLY;
  const shortSol = S.wal.sol < fee, shortBor = S.wal.bor < tr.unlock;
  const can = W.addr && !soldOut && !shortSol && !shortBor;
  return `<div class="grid-2"><div class="col">
  <section class="panel step">
    <h2 class="ph"><b>Step 1</b> <small>choose a machine</small><span class="tag or end">Now</span></h2>
    <div class="pad"><h3>How big a machine?</h3>
      <p>The tier sets how many tunnels the TBM can run at once. You can upgrade later.</p>
      <div class="opts">${TIERS.map((d, i) => `<button class="opt" data-act="pickTier" data-i="${i}" aria-pressed="${D.tier === i}"><span class="bores" aria-hidden="true">${'<i></i>'.repeat(d.cap)}</span><b>${d.name} TBM</b><span>${d.cap === 1 ? 'One active tunnel' : d.cap + ' simultaneous tunnels'}</span>
        <dl><dt>Unlock</dt><dd>${d.unlock ? fmtTok(d.unlock) + ' $BORE' : 'Free'}</dd><dt>Tunnels</dt><dd>${d.cap}</dd></dl></button>`).join('')}</div>
      <p class="note">${tr.blurb} Bigger machines open more tunnels, but every tunnel is its own bet. More tunnels don’t guarantee more revenue.</p>
    </div>
  </section>
  <section class="panel step">
    <h2 class="ph"><b>Step 2</b> <small>${fmtSol(fee)} SOL to deploy</small></h2>
    <div class="pad"><h3>${soldOut ? 'All 999 TBMs are deployed' : `Deploy TBM #${n}`}</h3>
      <p>${soldOut ? 'Machines now change hands on Tensor and Magic Eden, or you can rent one.' : 'The deploy price goes half to $BORE buy and burn, half to operations. The tier unlock is burned. Every tunnel it bores is minted to you as a Tunnel NFT.'}</p>
      ${!W.addr ? `<button class="btn dark" data-act="wallet">Connect wallet to deploy</button>`
        : `<button class="btn dark" data-act="deploy" ${can ? '' : 'disabled'}>Deploy TBM #${n}</button>
           ${shortSol ? `<p class="warn" style="margin:12px 0 0">Not enough SOL in your wallet.</p>` : ''}
           ${shortBor ? `<p class="warn" style="margin:12px 0 0">You need ${fmtTok(tr.unlock)} $BORE for a ${tr.name} TBM. Swap some from My TBMs.</p>` : ''}`}
    </div>
  </section></div>
  <aside class="col">
    <section class="panel"><h2 class="ph">${ART} You get <small>after step 2</small></h2>
      <div class="youget"><div class="frame">${tbmHTML({ id: n, tier: D.tier, live: tr.cap })}</div><div><b>#${Math.min(n, CFG.SUPPLY)}</b><span>${tr.name} TBM<br>${tr.cap === 1 ? 'One tunnel' : tr.cap + ' tunnels'} at once</span></div></div>
    </section>
    <section class="panel"><h2 class="ph">${ICO.coin} Summary <small>what moves</small></h2>
      <div class="rows">
        ${kv('Deploy price', fmtSol(fee) + ' SOL')}
        ${kv('Tier unlock (burned)', tr.unlock ? fmtTok(tr.unlock) + ' $BORE' : 'Free')}
        ${kv('Operator share', '55% of fees')}
        ${kv('Tunnel royalty', '15% to its holder')}
        ${kv('Wallet SOL', fmtSol(S.wal.sol) + ' SOL')}
        ${kv('Wallet $BORE', fmtTok(S.wal.bor))}
      </div>
    </section>
  </aside></div>`;
}

function vRentals(){
  const d = DURS[M.dur];
  let list = S.tbm.filter(e => e.list);
  if (M.tier !== 'all') list = list.filter(e => e.tier === +M.tier);
  const sorters = { value: (a, b) => (b.list.share * hourly(b) / b.list.price) - (a.list.share * hourly(a) / a.list.price), price: (a, b) => a.list.price - b.list.price, rev: (a, b) => hourly(b) - hourly(a), share: (a, b) => b.list.share - a.list.share };
  list.sort((a, b) => (!!a.rent - !!b.rent) || sorters[M.sort](a, b));
  const segb = (key, val, label) => `<button class="chip" data-act="m" data-key="${key}" data-val="${val}" aria-pressed="${String(M[key]) === String(val)}">${label}</button>`;
  const auctions = S.auc.map(a => {
    const e = tbmById.get(a.tbm), mine = a.bidder === 'you', next = a.bidder ? r50(a.bid * 1.1) : a.bid;
    return `<div class="auc">${tbmHTML(e)}<div><h4>TBM #${e.id}</h4><span class="small">${TIERS[e.tier].name} · ${capOf(e)} tunnels · ${fmtSol(hourly(e))} SOL/h</span>
      <label style="margin-top:12px">${mine ? 'Your bid is winning' : a.bidder ? 'Top bid' : 'Starting bid'}</label><div class="bid">${fmtTok(a.bid)} <small>$BORE</small></div>
      <p class="small" style="margin:0">24 h rental, renter keeps ${Math.round(a.share * 100)}% of the operator share. Ends in <span data-k="left:${a.ends}">${left(a.ends)}</span>.</p></div>
      <div>${!W.addr ? `<button class="btn sm" data-act="wallet">Connect wallet to bid</button>` : mine ? `<button class="btn sm" disabled>You’re the top bidder</button>` : `<button class="btn or" data-act="bid" data-a="${a.a}" ${S.wal.bor < next ? 'disabled' : ''}>Bid ${fmtTok(next)}</button>`}</div>
    </div>`; }).join('');
  return `<section class="panel"><h2 class="ph">${ICO.gavel} Rental auction <small>the best-earning machine goes to the highest bidder</small></h2>
    ${auctions || `<div class="empty">${ART}<span>No auction running right now.</span></div>`}
  </section>
  <section class="panel mt"><h2 class="ph">${ICO.rent} TBMs for rent <small>${list.length} listed</small></h2>
    <div class="filters">
      <div class="seg"><span>Rent for</span>${DURS.map((x, i) => segb('dur', i, x.name + (x.off ? ` (−${x.off * 100}%)` : ''))).join('')}</div>
      <div class="seg"><span>Tier</span>${segb('tier','all','All')}${TIERS.map((f, i) => segb('tier', String(i), f.name)).join('')}</div>
      <div class="seg"><span>Sort</span>${segb('sort','value','Best value')}${segb('sort','rev','Revenue')}${segb('sort','price','Price')}${segb('sort','share','Renter share')}</div>
    </div>
    ${list.length ? `<div class="lists">${list.map(e => { const cost = e.list.price * d.h * (1 - d.off), mine = isMine(e);
      return `<div class="lcard">${tbmHTML(e)}<div><h4>#${e.id}${mine ? '<span class="tag or">Yours</span>' : ''}</h4>
        <dl><dt>Tier</dt><dd>${TIERS[e.tier].name}</dd><dt>Tunnels</dt><dd>${capOf(e)} at once</dd><dt>Revenue</dt><dd>${fmtSol(hourly(e))} SOL/h</dd><dt>Renter share</dt><dd>${Math.round(e.list.share * 100)}%</dd><dt>Price</dt><dd>${fmtTok(e.list.price)} /h</dd></dl>
        ${e.rent ? `<button class="btn sm" disabled>Rented, back in ${left(e.rent.until)}</button>` : mine ? `<button class="btn sm" data-go="tbms">Manage listing</button>`
          : !W.addr ? `<button class="btn sm" data-act="wallet">Connect wallet</button>`
          : `<button class="btn sm or" data-act="rent" data-id="${e.id}" ${S.wal.bor < cost ? 'disabled' : ''}>Rent ${d.name} · ${fmtTok(cost)}</button>`}
      </div></div>`; }).join('')}</div>` : `<div class="empty">${ART}<span>No machines listed at this tier.</span></div>`}
  </section>`;
}

function tunnelCard(c, mine){
  const status = c.grad ? 'Graduated' : c.alive ? 'Live' : 'Quiet';
  return `<div class="tcard"><h4>$${esc(c.tick)}${mine && c.price ? '<span class="tag ghost">Listed</span>' : ''}</h4>${tunnelGlyph(c)}
    <dl><dt>Bored by</dt><dd>${c.netCoin ? 'Network ' + c.net : 'TBM #' + c.tbm}</dd><dt>Status</dt><dd>${status}</dd><dt>Network</dt><dd>${c.net ? 'Network ' + c.net : 'Not connected'}</dd><dt>Coin fees so far</dt><dd>${fmtSol(c.fees)} SOL</dd>
    ${mine ? `<dt>Your royalties</dt><dd data-k="roy:${c.id}">${LIVE.roy(c.id)}</dd>` : ''}${c.alive ? `<dt>Est. royalty left</dt><dd>${fmtSol(remRoy(c))} SOL</dd>` : ''}${c.price ? `<dt>Price</dt><dd>${fmtTok(c.price)} $BORE</dd>` : ''}</dl>
    <div class="btns">${mine
      ? `${!c.net && c.alive ? `<button class="btn sm or" data-act="netOpen" data-c="${c.id}">Connect</button>` : ''}${c.alive ? (c.price ? `<button class="btn sm" data-act="tunUnlist" data-c="${c.id}">Unlist</button>` : `<button class="btn sm" data-act="tunListOpen" data-c="${c.id}">Sell</button>`) : ''}`
      : !W.addr ? `<button class="btn sm" data-act="wallet">Connect wallet</button>` : `<button class="btn sm or" data-act="tunBuy" data-c="${c.id}" ${S.wal.bor < c.price ? 'disabled' : ''}>Buy · ${fmtTok(c.price)}</button>`}</div>
  </div>`;
}
function vTunnels(){
  const mine = myTunnels().sort((a, b) => (b.alive - a.alive) || (b.t0 - a.t0));
  let list = S.coins.filter(c => c.price > 0 && !c.user && c.alive);
  const sorters = { value: (a, b) => tunnelValue(b) / b.price - tunnelValue(a) / a.price, price: (a, b) => a.price - b.price, roy: (a, b) => remRoy(b) - remRoy(a) };
  list.sort(sorters[T.sort]);
  const segb = (key, val, label) => `<button class="chip" data-act="t" data-key="${key}" data-val="${val}" aria-pressed="${T[key] === val}">${label}</button>`;
  return `<section class="panel"><h2 class="ph">${ICO.tunnel} Your tunnels <small>Tunnel NFTs earn 15% of their coin’s creator fees</small></h2>
    ${!W.addr ? `<div class="empty">${ART}<span>Connect a wallet to see your Tunnel NFTs.</span><button class="btn or" data-act="wallet">Connect wallet</button></div>`
      : mine.length ? `<div class="tcards">${mine.slice(0, 40).map(c => tunnelCard(c, true)).join('')}</div>`
      : `<div class="empty">${ART}<span>No tunnels yet. Every tunnel a TBM you run bores is minted to you, or buy one below.</span></div>`}
  </section>
  <section class="panel mt"><h2 class="ph">${ICO.coin} Tunnel market <small>${list.length} for sale</small></h2>
    <div class="filters"><div class="seg"><span>Sort</span>${segb('sort','value','Best value')}${segb('sort','roy','Royalty left')}${segb('sort','price','Price')}</div></div>
    ${list.length ? `<div class="tcards">${list.map(c => tunnelCard(c, false)).join('')}</div>` : `<div class="empty">${ART}<span>No tunnels for sale right now.</span></div>`}
  </section>`;
}

function vNetworks(){
  return `<section class="panel"><h2 class="ph">${ICO.net} Tunnel networks <small>connected tunnels share a treasury</small></h2>
    <div class="pbody"><p>Connect a tunnel to a network and 5% of its coin’s creator fees go to that network’s treasury. The treasury burns 40% as $BORE buybacks, pays 40% to members by connected tunnel, and puts 20% toward network-funded launches. Connections are permanent.</p></div>
    <div class="nets" style="border-top:1px solid var(--rule)">${S.nets.map(n => `<div class="net"><h3>Net ${n.id}</h3>
      <div class="stats">
        <div><label>Connected tunnels</label><b>${n.n}</b></div>
        <div><label>Paid to members</label><b>${fmtSol(n.paid)} SOL</b></div>
        <div><label>$BORE burned</label><b>${fmtTok(n.burned)}</b></div>
        <div><label>Network launches</label><b>${n.launches}</b></div>
        ${W.addr ? `<div><label>Your tunnels</label><b>${S.myNet[n.id] || 0}</b></div><div><label>Your payouts</label><b data-k="netUn:${n.id}">${LIVE.netUn(n.id)}</b></div>` : ''}
      </div></div>`).join('')}</div>
  </section>
  <section class="panel mt"><h2 class="ph">${ICO.tunnel} Connect a tunnel <small>pick one of your live tunnels</small></h2>
    ${!W.addr ? `<div class="empty">${ART}<span>Connect a wallet to link your tunnels into a network.</span><button class="btn or" data-act="wallet">Connect wallet</button></div>`
      : (() => { const free = myTunnels().filter(c => c.alive && !c.net); return free.length ? `<div class="tcards">${free.map(c => tunnelCard(c, true)).join('')}</div>` : `<div class="empty">${ART}<span>No unconnected live tunnels. New tunnels from your TBMs appear here.</span></div>`; })()}
  </section>`;
}

function upRow(e, k){
  const u = UP[k], l = e[k], max = l >= u.max, cost = u.cost(l);
  return `<div class="up"><b>${u.name}<span class="pips" aria-label="Level ${l} of ${u.max}">${Array.from({ length: u.max }, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join('')}</span></b>
    <small>${max ? 'Maxed out' : u.eff}</small>
    <button class="btn sm" data-act="upgrade" data-id="${e.id}" data-k="${k}" ${max || S.wal.bor < cost ? 'disabled' : ''}>${max ? 'Maxed' : 'Upgrade · ' + fmtTok(cost)}</button></div>`;
}

        <div class="stats">
          <div><label>Time left</label><b data-k="left:${e.rent.until}">${left(e.rent.until)}</b></div>
          <div><label>You keep</label><b>${Math.round(e.rent.share * 100)}%</b></div>
          <div><label>Your earnings</label><b data-k="rentUn:${e.id}">${LIVE.rentUn(e.id)}</b></div>
          <div><label>Tunnels open</label><b>${e.live} / ${capOf(e)}</b></div>
        </div>
        <div class="btns"><button class="btn sm" data-act="openTbm" data-id="${e.id}">Journal</button></div>
      </div>
      <div><p class="small" style="margin:0">Your share of the operator fees settles to your wallet when the rental ends. Owner ${short(e.owner)} keeps the other ${100 - Math.round(e.rent.share * 100)}%.</p></div></div>`).join('')}
  </section>` : ''}
  <section class="panel mt"><h2 class="ph">${ART} TBMs you own <small>${mine.length}</small></h2>
    ${mine.length ? mine.map(e => `<div class="trow">
      <div>${tbmHTML(e)}</div>
      <div><h3>#${e.id} <span class="tag ghost">${TIERS[e.tier].name}</span></h3>

          <div><label>Unclaimed</label><b data-k="un:${e.id}">${LIVE.un(e.id)}</b></div>
          <div><label>Owner earnings</label><b data-k="own:${e.id}">${LIVE.own(e.id)}</b></div>
        </div>
        <div class="btns"><button class="btn sm or" data-act="claim" data-id="${e.id}">Claim</button><button class="btn sm" data-act="openTbm" data-id="${e.id}">Journal</button></div>
      </div>
      <div>
        <div class="rentbox">${e.rent ? `<b>Rented out</b><p>To ${short(e.rent.who)} for ${left(e.rent.until)} more. They keep ${Math.round(e.rent.share * 100)}% of the operator share; the rest still comes to you.</p>`
          : e.list ? `<b>Listed for rent</b><p>${fmtTok(e.list.price)} $BORE an hour, renter keeps ${Math.round(e.list.share * 100)}%. Payments settle to your wallet automatically.</p><div class="btns"><button class="btn sm" data-act="listOpen" data-id="${e.id}">Edit</button><button class="btn sm" data-act="unlist" data-id="${e.id}">Unlist</button></div>`

      </div></div>`).join('')
      : `<div class="empty">${ART}<span>None yet. Deploy one and it lands here.</span><button class="btn sm or" data-go="deploy">Deploy a TBM</button></div>`}
  </section>`;
}
function listModal(id){
  const e = tbmById.get(+id); if (!isMine(e)) return;
  if (LST.id !== e.id) { LST.id = e.id; LST.share = e.list ? e.list.share : 0.7; LST.mult = 1; }
  const p = r50(fair(e, LST.share) * LST.mult);
  modal(`<section class="panel modal" role="dialog" aria-modal="true" aria-labelledby="lt">
    <h2 class="ph" id="lt">${ICO.rent} List TBM #${e.id} for rent <button class="x" data-act="close" aria-label="Close">×</button></h2>
    <div class="pad">
      <label>Renter keeps</label>

  L.forEach((_, i) => { const a = (i + 0.5) / n * 2 * Math.PI - Math.PI / 2, x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a), rot = Math.atan2(ry * Math.cos(a), -rx * Math.sin(a)) * 180 / Math.PI; s += `<path class="arr" d="M -7 -6 L 7 0 L -7 6 Z" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)})"/>`; });
  L.forEach((t, i) => { const a = i / n * 2 * Math.PI - Math.PI / 2, x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a); s += `<g class="node${i === 6 ? ' hot' : ''}"><rect x="${(x - 96).toFixed(1)}" y="${(y - 19).toFixed(1)}" width="192" height="38"/><text x="${x.toFixed(1)}" y="${(y + 5).toFixed(1)}" text-anchor="middle">${t}</text></g>`; });

function doDeploy(){
  const n = S.tbm.length + 1; if (!W.addr || n > CFG.SUPPLY) return;
  const fee = mintPrice(n), tr = TIERS[D.tier];
  if (S.wal.sol < fee || S.wal.bor < tr.unlock) return;
  S.wal.sol -= fee; S.wal.bor -= tr.unlock;
  S.burnSol += fee * 0.5; S.burned += fee * 0.5 / price() + tr.unlock; S.ops += fee * 0.5;
  const e = { id: n, owner: W.addr, tier: D.tier, speed: 1, drill: 1, extra: 1, live: 0, count: 0, unclaimed: 0, rentUn: 0, own: 0, life: 0, rv: 0, j: [], user: true, list: null, rent: null, t: S.t };
  S.tbm.push(e); tbmById.set(e.id, e); S.ver++; save();
  toast(`TBM #${n} deployed. It starts boring now.`);
  location.hash = '#tbms';
}
function claimAll(){
  let v = 0;
  for (const e of myTbm()) { v += e.unclaimed; e.unclaimed = 0; }
  for (const e of myRent()) { v += e.rentUn; e.rentUn = 0; }
  for (const c of myTunnels()) { v += c.royUn; c.royUn = 0; }
  for (const k in S.netUn) { v += S.netUn[k]; S.netUn[k] = 0; }
  S.wal.sol += v; return v;
}

    case 'lsShare': LST.share = +a.dataset.v; listModal(LST.id); break;
    case 'lsMult': LST.mult = +a.dataset.v; listModal(LST.id); break;
    case 'listSave': { const e = tbmById.get(+a.dataset.id); if (!isMine(e)) break; e.list = { share: LST.share, price: +a.dataset.p, k: LST.mult }; closeModal(); toast(`TBM #${e.id} listed at ${fmtTok(e.list.price)} $BORE an hour`); after(); break; }
    case 'unlist': { const e = tbmById.get(+a.dataset.id); if (!isMine(e)) break; e.list = null; toast(`TBM #${e.id} unlisted`); after(); break; }
    case 'rent': {
      const e = tbmById.get(+a.dataset.id), d = DURS[M.dur]; if (!W.addr || !e || !e.list || e.rent || isMine(e) || inAuction(e)) break;
      const cost = e.list.price * d.h * (1 - d.off); if (S.wal.bor < cost) break;
      S.wal.bor -= cost; startRent(e, W.addr, true, d.h, cost, e.list.share);
      toast(`You’re running TBM #${e.id} for ${d.name}. You keep ${Math.round(e.list.share * 100)}% of the operator share.`); location.hash = '#tbms'; after(); break; }
    case 'bid': {
      const au = S.auc.find(x => x.a === +a.dataset.a); if (!au || !W.addr || au.bidder === 'you') break;
      const next = au.bidder ? r50(au.bid * 1.1) : au.bid; if (S.wal.bor < next) break;
      S.wal.bor -= next; au.bid = next; au.bidder = 'you'; toast(`You bid ${fmtTok(next)} $BORE on TBM #${au.tbm}`); after(); break; }
    case 'tunBuy': {
      const c = coinById.get(+a.dataset.c); if (!c || c.user || !c.price || !W.addr || S.wal.bor < c.price) break;
      S.wal.bor -= c.price; S.burned += c.price * CFG.SALE_ROYALTY; c.user = true; c.owner = W.addr; c.royUn = 0; c.price = 0;
      if (c.net) S.myNet[c.net] = (S.myNet[c.net] || 0) + 1;
      toast(`You bought tunnel $${c.tick}. Its royalties now come to you.`); after(); break; }
    case 'tunListOpen': TL.id = 0; tunListModal(a.dataset.c); break;
    case 'tlMult': TL.mult = +a.dataset.v; tunListModal(TL.id); break;
    case 'tunListSave': { const c = coinById.get(+a.dataset.c); if (!myTun(c)) break; c.price = +a.dataset.p; closeModal(); toast(`Tunnel $${c.tick} listed for ${fmtTok(c.price)} $BORE`); after(); break; }
    case 'tunUnlist': { const c = coinById.get(+a.dataset.c); if (!myTun(c)) break; c.price = 0; toast(`Tunnel $${c.tick} unlisted`); after(); break; }
    case 'netOpen': netModal(a.dataset.c); break;
    case 'netPick': { const c = coinById.get(+a.dataset.c); if (!myTun(c) || c.net) break; connect(c, +a.dataset.n); closeModal(); toast(`Tunnel $${c.tick} connected to network ${c.net}`); after(); break; }
    case 'docjump': { const el = document.getElementById('doc-' + a.dataset.id); el && el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); break; }
  }
  if (act !== 'wallet' && !a.closest('#walletMenu')) $('#walletMenu').hidden = true;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#overlay').innerHTML) closeModal(); $('#walletMenu').hidden = true; } });
window.addEventListener('hashchange', route);

/* ---------- boot ---------- */
load();
S.speed = 60;
route();
paintWallet();
setTimeout(eagerConnect, 500);
let lastTick = performance.now(), lastSave = 0;
setInterval(() => {
  const now = performance.now(), dt = Math.min(2, (now - lastTick) / 1000); lastTick = now;
  if (S.speed > 0) advance(S.speed * dt / 60);
  updateLive(); render(false);
  if (now - lastSave > 5000) { save(); lastSave = now; }
}, 250);
window.addEventListener('pagehide', save);
</script>
</body>
</html>
